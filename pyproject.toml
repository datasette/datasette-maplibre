[project]
name = "datasette-maplibre"
version = "0.1a0"
description = "Datasette plugin that maps latitude/longitude and GeoJSON data using MapLibre GL and OpenFreeMap"
readme = "README.md"
authors = [{name = "Simon Willison"}]
license = "Apache-2.0"
classifiers = [
    "Framework :: Datasette",
]
requires-python = ">=3.11"
dependencies = [
    "datasette>=0.65",
]

[project.urls]
Homepage = "https://github.com/simonw/datasette-maplibre"
Changelog = "https://github.com/simonw/datasette-maplibre/releases"
Issues = "https://github.com/simonw/datasette-maplibre/issues"
CI = "https://github.com/simonw/datasette-maplibre/actions"

[project.entry-points.datasette]
maplibre = "datasette_maplibre"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-playwright",
    "httpx",
    "nest-asyncio",
    "datasette-test",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = ["tests/**"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
