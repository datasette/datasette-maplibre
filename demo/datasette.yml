# Configuration for the demo: canned queries and datasette-maplibre settings.
# Titles, descriptions and the tour itself are in metadata.yml.
databases:
  demo:
    queries:
      earthquake_popups:
        title: Earthquakes with popups built in SQL
        description_html: |-
          <p>This query returns a <code>popup</code> column built with <code>json_object()</code>.
          Click an earthquake: the popup links to its page on the USGS site.</p>
        sql: |-
          select
            json_object(
              'title', 'Magnitude ' || magnitude,
              'description', place || ' - ' || time || ' UTC, ' || round(depth_km) || ' km deep',
              'link', url
            ) as popup,
            magnitude,
            latitude,
            longitude
          from earthquakes
          where magnitude >= cast(:min_magnitude as real)
          order by magnitude desc
    tables:
      earthquakes:
        plugins:
          datasette-maplibre:
            view: heatmap
      landmarks:
        plugins:
          datasette-maplibre:
            view: points
            color_column: kind
      countries:
        plugins:
          datasette-maplibre:
            color_column: continent
      rivers:
        plugins:
          datasette-maplibre:
            color_column: kind
      cities:
        plugins:
          datasette-maplibre:
            view: points
      capitals_and_countries:
        plugins:
          datasette-maplibre:
            view: points
            color_column: continent
